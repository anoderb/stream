<!doctype html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="Nobaryu — nonton bareng streaming olahraga live, gratis, langsung play." />
  <title>Nobaryu — Nonton Bareng Sport Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #080b12;
  --bg2: #0e1120;
  --surface: rgba(18, 22, 36, 0.85);
  --card: rgba(16, 20, 32, 0.92);
  --card2: #141828;
  --text: #f0f2f7;
  --muted: #6b7490;
  --muted2: #9099b2;
  --line: rgba(255,255,255,0.07);
  --line2: rgba(255,255,255,0.12);
  --accent: #e8ff47;
  --accent-dim: rgba(232,255,71,0.12);
  --accent-glow: rgba(232,255,71,0.25);
  --blue: #3d7fff;
  --blue-dim: rgba(61,127,255,0.15);
  --live: #ff4b55;
  --live-dim: rgba(255,75,85,0.15);
  --upcoming: #f5a623;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 8px 40px rgba(0,0,0,0.45);
}
[data-theme="light"] {
  --bg: #f3f5fa;
  --bg2: #e8ecf5;
  --surface: rgba(255,255,255,0.82);
  --card: rgba(255,255,255,0.9);
  --card2: #edf0fa;
  --text: #0d1020;
  --muted: #717a9c;
  --muted2: #5a6380;
  --line: rgba(10,20,60,0.09);
  --line2: rgba(10,20,60,0.15);
  --accent: #c5d800;
  --accent-dim: rgba(197,216,0,0.12);
  --accent-glow: rgba(197,216,0,0.22);
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 16px; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
  min-height: 100vh;
}
::selection { background: var(--accent); color: #080b12; }
a { color: inherit; text-decoration: none; }
img { display: block; }
svg { display: block; flex-shrink: 0; }
button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; font-size: inherit; }

/* LAYOUT */
.app-wrap {
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 20px;
}

/* HEADER */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 0;
  gap: 12px;
  flex-wrap: wrap;
}
.logo {
  font-family: 'Syne', sans-serif;
  font-weight: 900;
  font-size: 26px;
  letter-spacing: -0.03em;
  display: flex;
  align-items: center;
  gap: 4px;
}
.logo span { color: var(--accent); }
.logo-sub {
  font-size: 11px;
  font-weight: 600;
  color: var(--muted2);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-left: 6px;
  padding: 3px 8px;
  border-radius: 6px;
  background: var(--surface);
  border: 1px solid var(--line);
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}
.icon-btn {
  width: 38px; height: 38px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line2);
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted2);
  transition: 0.15s;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

/* SEARCH + STATS */
.hero {
  padding: 30px 0 0;
}
.hero h1 {
  font-family: 'Syne', sans-serif;
  font-weight: 900;
  font-size: 38px;
  letter-spacing: -0.03em;
  line-height: 1.15;
}
.hero h1 em { font-style: normal; color: var(--accent); }
.hero p {
  font-size: 15px;
  color: var(--muted);
  margin-top: 10px;
  max-width: 520px;
}
.stats-row {
  display: flex;
  gap: 20px;
  padding: 24px 0 0;
}
.stat-item {
  display: flex;
  align-items: center;
  gap: 8px;
}
.stat-num {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 22px;
  line-height: 1;
}
.stat-label {
  font-size: 12px;
  color: var(--muted2);
  font-weight: 500;
}
.stat-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  display: inline-block;
}
.stat-dot.live { background: var(--live); box-shadow: 0 0 8px var(--live); }
.stat-dot.upcoming { background: var(--upcoming); }

.search-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-top: 22px;
}
.search-icon {
  width: 20px; height: 20px;
  color: var(--muted);
  position: absolute;
  left: 14px;
  pointer-events: none;
}
.search-input {
  flex: 1;
  height: 48px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line2);
  background: var(--card);
  padding: 11px 14px 11px 44px;
  color: var(--text);
  outline: none;
  transition: 0.18s;
  font-size: 14px;
}
.search-input::placeholder { color: var(--muted); }
.search-input:focus { border-color: var(--accent); background: var(--card); }
.clear-btn {
  width: 40px; height: 40px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line2);
  background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  color: var(--muted);
  transition: 0.18s;
}
.clear-btn:hover { border-color: var(--live); color: var(--live); }

/* META */
.meta-bar { padding: 10px 0 0; font-size: 12px; color: var(--muted); font-weight: 500; }

/* CATEGORIES — WRAP, NO SCROLL */
.cats-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 16px 0 2px;
}
.cat-pill {
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  background: var(--surface);
  border: 1px solid var(--line2);
  color: var(--muted2);
  transition: 0.15s;
  white-space: nowrap;
}
.cat-pill:hover { border-color: var(--muted2); }
.cat-pill.active { background: var(--accent); border-color: var(--accent); color: #080b12; }

/* GRID */
.grid-section {
  padding: 6px 0 40px;
}
.grid-section-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 20px 0 8px;
  gap: 8px;
  flex-wrap: wrap;
}
.grid-section-header h2 {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 20px;
  letter-spacing: -0.02em;
}
.grid-section-header span {
  font-size: 12px;
  color: var(--muted2);
  font-weight: 500;
}

.event-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 16px;
}

/* CARD */
.event-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  transition: 0.18s;
  cursor: pointer;
}
.event-card:hover { border-color: var(--line2); transform: translateY(-2px); box-shadow: var(--shadow); }
.card-poster {
  position: relative;
  aspect-ratio: 16/9;
  background: var(--bg2);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.card-poster img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0.75; }
.poster-placeholder {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--muted);
  opacity: 0.4;
}
.badge-row {
  position: absolute;
  bottom: 8px; left: 8px;
  display: flex;
  gap: 4px;
}
.badge {
  padding: 3px 9px;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  backdrop-filter: blur(6px);
}
.badge-cat { background: rgba(0,0,0,0.55); color: var(--text); }
.badge-live { background: rgba(255,75,85,0.85); color: #fff; }
.badge-upcoming { background: rgba(245,166,35,0.85); color: #000; }
.badge-ended { background: rgba(255,255,255,0.12); color: var(--muted2); }

.card-body { padding: 14px; }
.card-league {
  font-size: 11px;
  font-weight: 600;
  color: var(--muted2);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 4px;
}
.card-title {
  font-weight: 600;
  font-size: 15px;
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 10px;
}
.card-meta-time {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: var(--muted2);
}
.card-meta-servers {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--muted);
}
.server-dots {
  display: flex;
  gap: 3px;
}
.server-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--muted);
}
.server-dot.active { background: var(--accent); }

.watch-btn {
  width: 100%;
  margin-top: 12px;
  padding: 10px;
  border-radius: var(--radius-sm);
  font-weight: 700;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: 0.15s;
}
.watch-btn.can-watch {
  background: var(--blue-dim);
  color: var(--blue);
  border: 1px solid rgba(61,127,255,0.2);
}
.watch-btn.can-watch:hover { background: var(--blue); color: #fff; }
.watch-btn.no-server {
  background: var(--surface);
  color: var(--muted2);
  border: 1px solid var(--line);
  cursor: default;
}

/* SKELETON */
.skeleton { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); height: 270px; }

/* STATE MSG */
.state-msg {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  color: var(--muted);
  font-size: 15px;
}

/* MODAL */
.modal {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.75);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
  z-index: 100;
  opacity: 0; pointer-events: none;
  transition: 0.22s;
  backdrop-filter: blur(2px);
}
.modal.open { opacity: 1; pointer-events: auto; }
.modal.open .player-sheet { transform: translateY(0) scale(1); opacity: 1; }
.player-sheet {
  width: min(960px, 100%);
  background: var(--card2);
  border: 1px solid var(--line2);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 40px 100px rgba(0,0,0,0.7);
  transform: translateY(20px) scale(0.97);
  opacity: 0;
  transition: 0.25s;
}
.player-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--card);
}
.player-title { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 15px; letter-spacing: -0.02em; }
.player-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.player-close {
  width: 32px; height: 32px;
  border-radius: 8px;
  border: 1px solid var(--line2);
  background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  color: var(--muted2); font-size: 14px; flex-shrink: 0;
  transition: 0.15s;
}
.player-close:hover { border-color: var(--live); color: var(--live); }
.frame-wrap { aspect-ratio: 16/9; background: #000; }
.frame-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }
.player-foot {
  padding: 12px 16px;
  border-top: 1px solid var(--line);
  background: var(--card);
}
.server-label {
  font-size: 11px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.07em;
  margin-bottom: 8px;
}
.server-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.server-tab {
  padding: 6px 12px;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid var(--line2);
  background: var(--surface);
  color: var(--muted2);
  transition: 0.15s;
}
.server-tab.active { background: var(--accent); border-color: var(--accent); color: #080b12; }
.server-tab:hover:not(.active) { border-color: var(--muted2); }

/* TOAST */
.toast {
  position: fixed; bottom: 20px; left: 50%;
  transform: translateX(-50%) translateY(8px);
  opacity: 0; pointer-events: none;
  background: var(--text); color: var(--bg);
  padding: 10px 16px;
  border-radius: 999px;
  font-size: 13px; font-weight: 700;
  z-index: 200;
  transition: 0.22s;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* MOBILE */
@media (max-width: 640px) {
  .app-wrap { padding: 0 12px; }
  .logo { font-size: 22px; }
  .hero h1 { font-size: 26px; }
  .stats-row { gap: 14px; flex-wrap: wrap; }
  .event-grid { grid-template-columns: 1fr; gap: 12px; }
  .header { padding: 12px 0; }
  .search-bar { flex-wrap: wrap; }
  .modal { padding: 8px; }
  .player-sheet { border-radius: 14px; }
}
  </style>
</head>
<body>
  <div class="app-wrap">

    <!-- HEADER -->
    <header class="header">
      <div class="logo">
        ⚡<span>nobaryu</span>
        <span class="logo-sub">live</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="themeBtn" title="Toggle tema">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path id="themeIcon" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="icon-btn" id="topRefresh" title="Refresh">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        </button>
      </div>
    </header>

    <!-- HERO -->
    <section class="hero">
      <h1>SPORT STREAMING <em>LIVE</em></h1>
      <p><em>Nonton bareng, gampang.</em> Portal streaming olahraga live. Pilih event, pilih server, langsung tonton. Gratis, ringan, tanpa ribet.</p>
      <div class="stats-row">
        <div class="stat-item"><span class="stat-dot live"></span><span class="stat-num" id="sLive">0</span><span class="stat-label">LIVE</span></div>
        <div class="stat-item"><span class="stat-dot upcoming"></span><span class="stat-num" id="sUpcoming">0</span><span class="stat-label">UPCOMING</span></div>
        <div class="stat-item">🎯<span class="stat-num" id="sTotal">0</span><span class="stat-label">EVENTS</span></div>
      </div>
      <div class="search-bar">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-input" id="search" type="text" placeholder="Cari match, liga, olahraga..." autocomplete="off" />
        <button class="clear-btn" id="clearBtn" title="Clear"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        <button class="icon-btn" id="refreshBtn" title="Refresh"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>
      </div>
      <div class="meta-bar" id="meta">Memuat data...</div>
    </section>

    <!-- CATEGORIES -->
    <nav class="cats-wrap" id="cats"></nav>

    <!-- GRID -->
    <section class="grid-section">
      <div class="grid-section-header">
        <h2>Semua Event</h2>
        <span id="sCount">—</span>
      </div>
      <div class="event-grid" id="grid">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </div>
    </section>

  </div>

  <!-- MODAL PLAYER -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="player-sheet">
      <div class="player-head">
        <div>
          <div class="player-title" id="playerTitle">—</div>
          <div class="player-sub" id="playerSub">—</div>
        </div>
        <button class="player-close" id="closeBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="frame-wrap"><iframe id="frame" allowfullscreen allow="autoplay; fullscreen; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-storage-access-by-user-activation"></iframe></div>
      <div class="player-foot">
        <div class="server-label">Pilih Server</div>
        <div class="server-tabs" id="serverTabs"></div>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
